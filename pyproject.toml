[project]
name = "orchestrator"
version = "0.1.0"
description = "OpenAI-compatible router across the local model fleet (shipinabottle GLM, llama.cpp backends)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
orchestrator = "orchestrator.server:main"
pipeline = "pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orchestrator", "pipeline"]
